name: Deploy Rasel Babu Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/raselbabu/htdocs/raselbabu.com
            git remote set-url origin https://github.com/fkmusiclimited/Rasel-Babu.git
            git pull origin main
            npm install --force
            npm run build
            fuser -k 3001/tcp || true
            nohup npm start > app.log 2>&1 &
            sleep 3
            curl -fsS http://127.0.0.1:3001 >/dev/null
